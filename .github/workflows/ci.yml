name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitize: 'OFF'
          - build_type: Debug
            sanitize: 'ON'
          - build_type: Release
            sanitize: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libsqlite3-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DEDGE_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build -j2
      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Validate configuration
        run: build/edge-gateway --config config/gateway.conf --check
