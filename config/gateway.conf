# Local runnable demo. Lines beginning with # are comments; unknown/duplicate keys fail.
source=simulate
serial_device=/dev/ttyUSB0
baud=9600
parity=N
unit=1
register_start=0
interval_ms=1000
timeout_ms=300
reconnect_ms=1000
bind=127.0.0.1
port=8080
database=gateway.db
queue_capacity=256
max_rows=100000
alarm_high=30
alarm_hysteresis=2
